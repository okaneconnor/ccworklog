<!-- skills/worklog/templates/report.html -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ccworklog report</title>
<style>
  /* ── Ledger tokens ───────────────────────────────────────────────── */
  :root {
    --paper: #F3F6EE; --surface: #FAFBF6; --ink: #202A22; --muted: #66735F;
    --rule-red: #B23A2C; --ink-blue: #2E4E7E; --stamp: #3F7A52;
    --hairline: #DCE2D2; --rail: #EEF2E4; --shadow: rgba(32, 42, 34, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #10150F; --surface: #171D15; --ink: #DCE3D5; --muted: #8B9683;
      --rule-red: #D2604C; --ink-blue: #86A9D8; --stamp: #74B189;
      --hairline: #262E22; --rail: #131811; --shadow: rgba(0, 0, 0, 0.3);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
    max-width: 900px; margin: 0 auto; padding: 3rem 1.25rem 6rem;
  }
  .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }

  /* ── Masthead ────────────────────────────────────────────────────── */
  header { border-bottom: 3px double var(--ink); padding-bottom: 1.1rem; margin-bottom: 2.2rem; }
  .eyebrow { font: 600 11px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.22em;
             text-transform: uppercase; color: var(--muted); }
  h1 { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
       font-size: clamp(1.9rem, 5vw, 2.6rem); font-weight: 600; letter-spacing: -0.01em;
       margin: 0.35rem 0 0.2rem; }
  h1 .no { color: var(--rule-red); }
  .statline { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; color: var(--muted); }
  .statline b { color: var(--ink); font-weight: 600; }

  /* ── Ledger blocks: the red margin rule is the page's signature ──── */
  section { margin-bottom: 2rem; }
  .block {
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 3px;
    box-shadow: 0 1px 2px var(--shadow); position: relative;
    padding-left: 84px;
  }
  .block::before {  /* the ledger margin rule */
    content: ""; position: absolute; top: 0; bottom: 0; left: 72px;
    width: 2px; background: var(--rule-red); opacity: 0.85;
  }
  .sechead {
    font: 600 11px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--muted); margin: 0 0 0.6rem 2px;
  }
  .row { display: block; padding: 0.55rem 1.1rem 0.55rem 0.9rem; position: relative;
         border-bottom: 1px solid var(--hairline); }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: var(--rail); }
  .marginnote {
    position: absolute; left: -84px; width: 72px; top: 0.6rem;
    font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted);
    text-align: right; padding-right: 10px; overflow-wrap: break-word;
  }
  .tick { color: var(--stamp); font-weight: 700; margin-right: 0.45rem; }
  .flag { color: var(--rule-red); font-weight: 700; margin-right: 0.45rem; }

  /* ── Standup + stamp button ─────────────────────────────────────── */
  .stamp {
    float: right; margin: 0.6rem 0.9rem 0 0.9rem;
    font: 700 10.5px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--stamp);
    background: none; border: 1.5px dashed var(--stamp); border-radius: 3px;
    padding: 0.45rem 0.7rem; cursor: pointer; transform: rotate(-1.2deg);
    transition: transform 0.12s ease;
  }
  .stamp:hover { transform: rotate(0deg) scale(1.03); }
  .stamp:focus-visible { outline: 2px solid var(--ink-blue); outline-offset: 2px; }

  /* ── Detail ─────────────────────────────────────────────────────── */
  .ws-head { font-size: 1.25rem; font-weight: 600; }
  .narrative { color: var(--muted); font-style: italic; margin: 0.15rem 0 0.3rem; }
  details { margin: 0.3rem 0 0.1rem; }
  summary { cursor: pointer; font-size: 0.9rem; color: var(--ink-blue); }
  summary:hover { text-decoration: underline; }
  pre {
    font: 12px/1.55 ui-monospace, "SF Mono", Menlo, monospace;
    background: var(--rail); border-left: 3px solid var(--rule-red); border-radius: 0 3px 3px 0;
    padding: 0.6rem 0.8rem; overflow-x: auto; margin: 0.45rem 0;
  }
  .meta { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: var(--muted); }
  .commits { font-family: ui-monospace, Menlo, monospace; font-size: 12px;
             list-style: none; padding: 0.2rem 0 0 0; }
  .commits li { padding: 0.12rem 0; }
  .commits .sha { color: var(--ink-blue); }

  /* ── Activity appendix: session span bars on a 24h track ────────── */
  .track { position: relative; height: 10px; background: var(--rail);
           border: 1px solid var(--hairline); border-radius: 2px; margin: 0.45rem 0 0.3rem; }
  .span { position: absolute; top: 1px; bottom: 1px; background: var(--ink-blue);
          opacity: 0.75; border-radius: 1px; min-width: 3px; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.3rem; padding: 0.3rem 0; }
  .chip { font-family: ui-monospace, Menlo, monospace; font-size: 11px;
          background: var(--rail); border: 1px solid var(--hairline); border-radius: 3px;
          padding: 0.15rem 0.45rem; overflow-wrap: anywhere; }

  footer { margin-top: 3.2rem; border-top: 3px double var(--ink); padding-top: 0.8rem;
           font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: var(--muted); }

  /* ── Load reveal, restrained ────────────────────────────────────── */
  section, header { animation: settle 0.4s ease both; }
  section:nth-of-type(1) { animation-delay: 0.05s; } section:nth-of-type(2) { animation-delay: 0.11s; }
  section:nth-of-type(3) { animation-delay: 0.17s; } section:nth-of-type(4) { animation-delay: 0.23s; }
  section:nth-of-type(5) { animation-delay: 0.29s; }
  @keyframes settle { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { section, header, .stamp { animation: none; transition: none; } }

  @media (max-width: 640px) {
    .block { padding-left: 0; } .block::before { left: 0; width: 3px; }
    .marginnote { position: static; width: auto; text-align: left; padding: 0 0 0.1rem 1rem; display: block; }
    .row { padding-left: 1rem; }
    .stamp { float: none; margin: 0.8rem 1rem 0; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script id="data" type="application/json">__CCWORKLOG_DATA__</script>
<script>
const R = JSON.parse(document.getElementById('data').textContent);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hhmm = (ts) => { const d = new Date(ts); return isNaN(d) ? '' : `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const dayFrac = (ts) => { const d = new Date(ts); return isNaN(d) ? null : (d.getHours() * 60 + d.getMinutes()) / 1440; };
const el = [];

/* ── Masthead ── */
const days = R.days || [];
const acts = (R.activity && R.activity.sessions) || [];
const commitTotal = (R.personal || []).reduce((n, p) => n + ((p.commits || []).filter((c) => !/^\+\d+ more$/.test(String(c))).length), 0)
  + (R.alsoShipped || []).reduce((n, a) => n + ((a.commits || []).length), 0);
const projects = [...new Set([...(R.standup || []).map((s) => s.project), ...(R.timeline || []).flatMap((t) => t.projects || [])].filter(Boolean))];
const weekday = days.length === 1
  ? new Date(`${days[0]}T12:00:00`).toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' })
  : `${days.length} days`;
el.push(`<header>
  <div class="eyebrow">Engineer&#39;s worklog &middot; 100% local</div>
  <h1>Worklog <span class="no">No. ${esc(R.label)}</span></h1>
  <div class="statline">${esc(weekday)} &middot; <b>${acts.length || '&ndash;'}</b> session${acts.length === 1 ? '' : 's'} &middot; <b>${commitTotal}</b> commit${commitTotal === 1 ? '' : 's'} &middot; <b>${projects.length}</b> project${projects.length === 1 ? '' : 's'}</div>
</header>`);

/* ── Open threads ── */
const open = (R.threads && R.threads.open) || [];
if (open.length) {
  el.push('<section><div class="sechead">Open threads</div><div class="block">');
  for (const t of open) el.push(`<div class="row"><span class="marginnote">since ${esc(String(t.firstSeen ?? '').slice(5))}</span><span class="flag">&#9873;</span>${esc(t.text)} <span class="meta">(${esc(t.repo)} &mdash; ${esc(t.lastState)})</span></div>`);
  el.push('</div></section>');
}

/* ── Standup ── */
el.push('<section><div class="sechead">Standup &mdash; shareable</div><div class="block">');
el.push('<button class="stamp" onclick="copyStandup(this)">Copy md</button>');
for (const s of R.standup || []) {
  for (const o of s.outcomes || []) el.push(`<div class="row"><span class="marginnote">${esc(s.workstream)}</span><span class="tick">&#10003;</span>${esc(o)}</div>`);
}
for (const a of R.alsoShipped || []) {
  el.push(`<div class="row"><span class="marginnote">${esc(String(a.repo ?? '').split('/').pop())}</span><span class="tick">&#10003;</span>${esc(a.summary)} <span class="meta">(outside Claude Code)</span></div>`);
}
el.push('</div></section>');

/* ── Detail ── */
if ((R.personal || []).length) {
  el.push('<section><div class="sechead">Detail &mdash; personal</div>');
  for (const p of R.personal || []) {
    el.push(`<div class="block" style="margin-bottom:0.8rem"><div class="row"><span class="marginnote">stream</span><div class="ws-head serif">${esc(p.workstream)}</div><p class="narrative">${esc(p.narrative)}</p></div>`);
    for (const it of p.items || []) {
      const ev = it.evidence || {};
      el.push(`<div class="row"><span class="marginnote">entry</span>${esc(it.claim)}${it.low_confidence ? ' <em class="meta">(low confidence)</em>' : ''}`);
      el.push('<details><summary>evidence</summary>');
      if (it.detail) el.push(`<p>${esc(it.detail)}</p>`);
      if (ev.error_excerpt) el.push(`<pre>${esc(ev.error_excerpt)}</pre>`);
      if ((ev.files || []).length) el.push(`<div class="chips">${ev.files.map((f) => `<span class="chip">${esc(f)}</span>`).join('')}</div>`);
      if ((ev.commands || []).length) el.push(`<pre>${ev.commands.map(esc).join('\n')}</pre>`);
      if ((ev.commit_shas || []).length) el.push(`<div class="meta">commits: ${ev.commit_shas.map(esc).join(', ')}</div>`);
      if ((ev.pr_links || []).length) el.push(`<div class="meta">PRs: ${ev.pr_links.map(esc).join(' &middot; ')}</div>`);
      el.push('</details></div>');
    }
    const commits = p.commits || [];
    if (commits.length) {
      const li = (c) => { const m = String(c).match(/^([0-9a-f]{6,10})\s+(.*)$/i); return m ? `<li><span class="sha">${esc(m[1])}</span> ${esc(m[2])}</li>` : `<li>${esc(c)}</li>`; };
      const shown = commits.slice(0, 8), rest = commits.slice(8);
      el.push(`<div class="row"><span class="marginnote">${commits.length} commit${commits.length === 1 ? '' : 's'}</span><ul class="commits">${shown.map(li).join('')}</ul>`);
      if (rest.length) el.push(`<details><summary>${rest.length} more</summary><ul class="commits">${rest.map(li).join('')}</ul></details>`);
      el.push('</div>');
    }
    el.push('</div>');
  }
  el.push('</section>');
}

/* ── Activity appendix (deterministic, from evidence packs) ── */
if (acts.length) {
  const multiDay = new Set(acts.map((x) => x.day)).size > 1;
  el.push('<section><div class="sechead">Activity &mdash; appendix</div><div class="block">');
  for (const s of acts) {
    const f0 = dayFrac(s.firstTs), f1 = dayFrac(s.lastTs);
    const durMin = (s.firstTs && s.lastTs) ? Math.max(1, Math.round((new Date(s.lastTs) - new Date(s.firstTs)) / 60000)) : null;
    const files = s.files || [], commands = s.commands || [];
    el.push(`<div class="row"><span class="marginnote">${esc(hhmm(s.firstTs))}&ndash;${esc(hhmm(s.lastTs))}</span><b>${esc(s.title || s.sessionId)}</b>${multiDay ? ` <span class="meta">${esc(s.day)}</span>` : ''}`);
    if (f0 != null && f1 != null && f1 >= f0) {
      el.push(`<div class="track" title="session span across the day"><div class="span" style="left:${(f0 * 100).toFixed(1)}%;width:${(Math.max(f1 - f0, 0.004) * 100).toFixed(1)}%"></div></div>`);
    }
    el.push(`<div class="meta">${files.length} file${files.length === 1 ? '' : 's'} &middot; ${commands.length} command${commands.length === 1 ? '' : 's'} &middot; ${s.promptCount ?? 0} prompt${s.promptCount === 1 ? '' : 's'}${durMin ? ` &middot; ${durMin >= 60 ? `${Math.floor(durMin / 60)}h ${durMin % 60}m` : `${durMin}m`}` : ''}${s.elided ? ' &middot; partial coverage' : ''}</div>`);
    if (files.length) el.push(`<details><summary>files touched</summary><div class="chips">${files.map((f) => `<span class="chip">${esc(f)}</span>`).join('')}</div></details>`);
    if (commands.length) el.push(`<details><summary>commands run</summary><pre>${commands.map(esc).join('\n')}</pre></details>`);
    el.push('</div>');
  }
  el.push('</div></section>');
}

/* ── Timeline (multi-day) ── */
if ((R.timeline || []).length > 1) {
  el.push('<section><div class="sechead">Timeline</div><div class="block">');
  for (const d of R.timeline) el.push(`<div class="row"><span class="marginnote">${esc(String(d.day ?? '').slice(5))}</span>${d.empty ? '<span class="meta">no activity</span>' : esc((d.projects || []).join(', '))}</div>`);
  el.push('</div></section>');
}

/* ── Footer ── */
const missed = (R.footer && R.footer.missedSessions) || [];
el.push(`<footer>${esc((R.footer && R.footer.parseHealth) || '')}${missed.length ? ` &middot; &#9888; not digested: ${missed.map(esc).join(', ')} &mdash; re-run /worklog` : ''} &middot; ccworklog</footer>`);
document.getElementById('app').innerHTML = el.join('');

function copyStandup(btn) {
  const lines = [];
  for (const s of R.standup || []) for (const o of s.outcomes || []) lines.push(`- ${s.workstream}: ${o}`);
  for (const t of open.slice(0, 5)) lines.push(`- next: ${t.text}`);
  navigator.clipboard.writeText(lines.join('\n'))
    .then(() => { btn.textContent = 'Copied ✓'; })
    .catch(() => { btn.textContent = 'Copy failed'; });
}
</script>
</body>
</html>
